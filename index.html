<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag crucial para que se vea y comporte como App nativa en móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Clientes</title>
    <!-- Tailwind CSS para el diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Ajustes para parecer más una app */
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6; /* gray-100 */
        }
        /* Spinner de carga */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6; /* blue-500 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header (Sticky tipo App) -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto flex items-center justify-center">
            <i class="fas fa-users-cog text-2xl mr-3"></i>
            <h1 class="text-xl font-bold">Registro de Clientes</h1>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-grow p-4">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
            
            <p class="text-sm text-gray-500 mb-6 text-center">
                Completa los datos. La ubicación y fecha se capturarán automáticamente.
            </p>

            <form id="registroForm" class="space-y-5">
                
                <!-- Campos Ocultos para Ubicación y Fecha -->
                <input type="hidden" id="ubicacion" name="ubicacion">
                <input type="hidden" id="fechaHora" name="fechaHora">

                <!-- 1. Nombre de Vendedor -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="vendedor">Nombre de Vendedor <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user-tie text-gray-400"></i>
                        </div>
                        <input type="text" id="vendedor" name="vendedor" required placeholder="Ej. Carlos Pérez" 
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- 2. Nombre de Cliente -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="cliente">Nombre de Cliente <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="cliente" name="cliente" required placeholder="Ej. Empresa S.A." onblur="capitalizarTexto(this)"
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- 3. Código de Cliente -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="codigo">Código de Cliente <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-id-badge text-gray-400"></i>
                        </div>
                        <input type="text" id="codigo" name="codigo" required placeholder="Ej. CLI-1029" 
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- 4. Correo de Cliente -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="correo">Correo Electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" id="correo" name="correo" placeholder="cliente@correo.com" 
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- 5. Departamento -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="departamento">Departamento <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-map-marked-alt text-gray-400"></i>
                        </div>
                        <select id="departamento" name="departamento" required 
                            class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base appearance-none bg-white">
                            <option value="" disabled selected>Selecciona un departamento</option>
                            <option value="Alta Verapaz">Alta Verapaz</option>
                            <option value="Baja Verapaz">Baja Verapaz</option>
                            <option value="Chimaltenango">Chimaltenango</option>
                            <option value="Chiquimula">Chiquimula</option>
                            <option value="El Progreso">El Progreso</option>
                            <option value="Escuintla">Escuintla</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="Huehuetenango">Huehuetenango</option>
                            <option value="Izabal">Izabal</option>
                            <option value="Jalapa">Jalapa</option>
                            <option value="Jutiapa">Jutiapa</option>
                            <option value="Petén">Petén</option>
                            <option value="Quetzaltenango">Quetzaltenango</option>
                            <option value="Quiché">Quiché</option>
                            <option value="Retalhuleu">Retalhuleu</option>
                            <option value="Sacatepéquez">Sacatepéquez</option>
                            <option value="San Marcos">San Marcos</option>
                            <option value="Santa Rosa">Santa Rosa</option>
                            <option value="Sololá">Sololá</option>
                            <option value="Suchitepéquez">Suchitepéquez</option>
                            <option value="Totonicapán">Totonicapán</option>
                            <option value="Zacapa">Zacapa</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                            <i class="fas fa-chevron-down text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- 6. Municipio -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="municipio">Municipio <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-map-pin text-gray-400"></i>
                        </div>
                        <input type="text" id="municipio" name="municipio" required placeholder="Ej. Mixco" 
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- 7. Número de Teléfono (Celular) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="telefono">Teléfono Celular <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-mobile-alt text-gray-400"></i>
                        </div>
                        <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 5555-5555" 
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- 8. Número de Teléfono Fijo -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1" for="telefonoFijo">Teléfono Fijo</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-phone-alt text-gray-400"></i>
                        </div>
                        <input type="tel" id="telefonoFijo" name="telefonoFijo" placeholder="Ej. 2222-2222" 
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-base transition-colors">
                    </div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl mt-4 shadow-lg transition-transform transform hover:-translate-y-0.5 flex justify-center items-center text-lg">
                    <i class="fas fa-paper-plane mr-2"></i> Enviar Registro
                </button>

            </form>
        </div>
    </main>

    <!-- Modal de Carga / Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-70 z-50 hidden flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p id="loadingText" class="text-white text-lg font-semibold">Obteniendo ubicación...</p>
    </div>

    <!-- Modal de Éxito -->
    <div id="successModal" class="fixed inset-0 bg-gray-900 bg-opacity-70 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-100 transition-transform">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-3xl text-green-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">¡Registro Exitoso!</h2>
            <p class="text-gray-600 mb-6">Los datos han sido guardados en la base de datos correctamente.</p>
            <button onclick="closeSuccessModal()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl transition-colors">
                Nuevo Registro
            </button>
        </div>
    </div>

    <script>
        // =========================================================================
        // ⚠️ IMPORTANTE: REEMPLAZA ESTA URL CON LA QUE TE DE GOOGLE APPS SCRIPT
        // =========================================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8KYULiMngMxRqLXuJ38VsY2QQ__92DVDEdi5LDvEFW8IfMTDblXhWwqC48c87SQEM/exec"; 

        const form = document.getElementById('registroForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const successModal = document.getElementById('successModal');

        // --- INICIO DE AUTOMATIZACIONES ---

        // 1. Cargar datos guardados al iniciar (Recordar Vendedor)
        document.addEventListener("DOMContentLoaded", () => {
            const vendedorGuardado = localStorage.getItem("vendedorGuardado");
            if (vendedorGuardado) {
                document.getElementById("vendedor").value = vendedorGuardado;
            }
        });

        // 2. Formatear Teléfono (Agrega el guion)
        function formatearTelefono(input) {
            let num = input.value.replace(/\D/g, ''); // Quita todo lo que no sea número
            if (num.length > 4) {
                num = num.substring(0, 4) + '-' + num.substring(4, 8);
            }
            input.value = num;
        }

        // 3. Capitalizar Nombres (juan perez -> Juan Perez)
        function capitalizarTexto(input) {
            let palabras = input.value.split(" ");
            let textoCapitalizado = palabras.map(palabra => {
                return palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();
            }).join(" ");
            input.value = textoCapitalizado;
        }

        // --- FIN DE AUTOMATIZACIONES ---

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (SCRIPT_URL.includes("TU_CODIGO_AQUI")) {
                alert("Primero debes configurar la SCRIPT_URL en el código HTML con el enlace de tu Google Sheet.");
                return;
            }

            // Guardar el nombre del vendedor en el celular para la próxima vez
            localStorage.setItem("vendedorGuardado", document.getElementById("vendedor").value);

            // 1. Mostrar pantalla de carga
            loadingText.innerText = "Obteniendo ubicación GPS...";
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');

            // 2. Obtener fecha y hora actual
            const now = new Date();
            const fechaFormateada = now.toLocaleString('es-GT'); // Formato local
            document.getElementById('fechaHora').value = fechaFormateada;

            // 3. Obtener Ubicación (Coordenadas)
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Éxito obteniendo coordenadas
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        document.getElementById('ubicacion').value = `${lat}, ${lng}`;
                        
                        // Proceder a enviar los datos
                        enviarDatosSheet();
                    },
                    (error) => {
                        // Error de GPS (Denegado o sin señal)
                        console.warn("Error GPS:", error.message);
                        alert("No se pudo obtener la ubicación. Por favor, asegúrate de tener el GPS encendido y haber dado permisos al navegador.");
                        loadingOverlay.classList.add('hidden');
                        loadingOverlay.classList.remove('flex');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("Tu dispositivo o navegador no soporta geolocalización.");
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
            }
        });

        function enviarDatosSheet() {
            loadingText.innerText = "Guardando en la base de datos...";
            
            const formData = new FormData(form);

            // Fetch usando 'no-cors' para evitar problemas de dominios cruzados con Google
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                // Al usar no-cors, la respuesta siempre es opaca, asumimos éxito si no hay error de red
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
                
                // Mostrar Modal de Éxito
                successModal.classList.remove('hidden');
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert("Hubo un error de conexión al intentar enviar los datos. Revisa tu internet.");
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
            });
        }

        function closeSuccessModal() {
            successModal.classList.add('hidden');
            
            // Limpiar formulario PERO mantener el nombre del vendedor
            const vendedorActual = document.getElementById("vendedor").value;
            form.reset(); 
            document.getElementById("vendedor").value = vendedorActual;

            window.scrollTo({ top: 0, behavior: 'smooth' }); // Volver arriba
        }
    </script>
</body>
</html>
