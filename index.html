<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Clientes - IMADE</title>
    
    <!-- ========================================== -->
    <!-- META TAGS PARA PWA (IPHONE Y ANDROID)      -->
    <!-- ========================================== -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IMADE">
    <link rel="apple-touch-icon" id="apple-icon" href="https://via.placeholder.com/512/4f46e5/ffffff?text=IMADE">
    <link rel="manifest" id="manifest-link">
    <!-- ========================================== -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc; /* slate-50 */
        }
        /* Spinner de carga estilizado */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Estilos de input modernos */
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus-within {
            transform: translateY(-2px);
        }
        /* Animación para el botón de instalar */
        #btnInstalar:not(.hidden) {
            animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bounce-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Header (Sticky tipo App con gradiente) -->
    <header class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white p-4 shadow-lg sticky top-0 z-40 rounded-b-2xl">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <!-- Contenedor de Logo y Título -->
            <div class="flex items-center">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-sm mr-3">
                    <i class="fas fa-users-cog text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Registro de Clientes</h1>
                    <p class="text-[10px] text-indigo-100 font-medium tracking-wider uppercase">IT - Grupo Imade</p>
                </div>
            </div>
    
            <!-- Botón de Instalar Mejorado -->
            <button id="btnInstalar" class="hidden bg-white/20 hover:bg-white/30 px-3 py-2 rounded-xl text-xs font-bold transition-all backdrop-blur-sm border border-white/10 flex items-center gap-2 active:scale-95">
                <i class="fas fa-download"></i>
                <span>Instalar</span>
            </button>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-grow p-4 mt-2">
        <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-7 mb-8 border border-slate-100 relative overflow-hidden">
            
            <!-- Decoración de fondo -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

            <form id="registroForm" class="space-y-6 relative z-10">
                
                <!-- Campos Ocultos para Ubicación y Fecha -->
                <input type="hidden" id="ubicacion" name="ubicacion">
                <input type="hidden" id="fechaHora" name="fechaHora">

                <!-- 1. Nombre de Vendedor -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="vendedor">Nombre de Vendedor <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-user-tie text-indigo-400"></i>
                        </div>
                        <input type="text" id="vendedor" name="vendedor" required placeholder="Ej. Carlos Pérez" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base transition-all shadow-sm">
                    </div>
                </div>

                <!-- 2. Nombre de Cliente -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="cliente">Nombre de Cliente <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-user text-indigo-400"></i>
                        </div>
                        <input type="text" id="cliente" name="cliente" required placeholder="Ej. Diego Lara" onblur="capitalizarTexto(this)"
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base transition-all shadow-sm">
                    </div>
                </div>

                <!-- 3. Código de Cliente -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="codigo">Código de Cliente <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-id-badge text-indigo-400"></i>
                        </div>
                        <input type="text" id="codigo" name="codigo" required placeholder="Ej. 1029" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base transition-all shadow-sm">
                    </div>
                </div>

                <!-- 4. Correo de Cliente -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="correo">Correo de Cliente <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-indigo-400"></i>
                        </div>
                        <input type="email" id="correo" name="correo" required placeholder="cliente@correo.com" 
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base transition-all shadow-sm">
                    </div>
                </div>

                <!-- 5. Departamento -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="departamento">Departamento <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-map-marked-alt text-indigo-400"></i>
                        </div>
                        <select id="departamento" name="departamento" required onchange="actualizarMunicipios()"
                            class="w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base appearance-none shadow-sm transition-all text-slate-700">
                            <option value="" disabled selected>Selecciona un departamento</option>
                            <option value="Alta Verapaz">Alta Verapaz</option>
                            <option value="Baja Verapaz">Baja Verapaz</option>
                            <option value="Chimaltenango">Chimaltenango</option>
                            <option value="Chiquimula">Chiquimula</option>
                            <option value="El Progreso">El Progreso</option>
                            <option value="Escuintla">Escuintla</option>
                            <option value="Guatemala">Guatemala</option>
                            <option value="Huehuetenango">Huehuetenango</option>
                            <option value="Izabal">Izabal</option>
                            <option value="Jalapa">Jalapa</option>
                            <option value="Jutiapa">Jutiapa</option>
                            <option value="Petén">Petén</option>
                            <option value="Quetzaltenango">Quetzaltenango</option>
                            <option value="Quiché">Quiché</option>
                            <option value="Retalhuleu">Retalhuleu</option>
                            <option value="Sacatepéquez">Sacatepéquez</option>
                            <option value="San Marcos">San Marcos</option>
                            <option value="Santa Rosa">Santa Rosa</option>
                            <option value="Sololá">Sololá</option>
                            <option value="Suchitepéquez">Suchitepéquez</option>
                            <option value="Totonicapán">Totonicapán</option>
                            <option value="Zacapa">Zacapa</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <i class="fas fa-chevron-down text-slate-400"></i>
                        </div>
                    </div>
                </div>

                <!-- 6. Municipio -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="municipio">Municipio <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-map-pin text-indigo-400"></i>
                        </div>
                        <select id="municipio" name="municipio" required disabled
                            class="w-full pl-11 pr-10 py-3.5 bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base appearance-none shadow-sm transition-all text-slate-500 cursor-not-allowed">
                            <option value="" disabled selected>Primero elige un departamento</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <i class="fas fa-chevron-down text-slate-400"></i>
                        </div>
                    </div>
                </div>

                <!-- 7. Número de Teléfono (Celular) -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="telefono">Teléfono Celular del Cliente <span class="text-rose-500">*</span></label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-mobile-alt text-indigo-400"></i>
                        </div>
                        <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 5555-5555" maxlength="9" oninput="formatearTelefono(this)"
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base transition-all shadow-sm tracking-wider">
                    </div>
                </div>

                <!-- 8. Número de Teléfono Fijo -->
                <div class="input-field">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="telefonoFijo">Teléfono Fijo del Cliente</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="fas fa-phone-alt text-indigo-400"></i>
                        </div>
                        <input type="tel" id="telefonoFijo" name="telefonoFijo" placeholder="Ej. 2222-2222" maxlength="9" oninput="formatearTelefono(this)"
                            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-base transition-all shadow-sm tracking-wider">
                    </div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-4 px-4 rounded-xl mt-6 shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-1 flex justify-center items-center text-lg active:scale-95">
                    <i class="fas fa-paper-plane mr-2"></i> Guardar Registro
                </button>

            </form>
        </div>
    </main>

    <!-- Modal de Carga / Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center transition-opacity">
        <div class="loader mb-5"></div>
        <p id="loadingText" class="text-white text-lg font-semibold tracking-wide text-center px-4">Obteniendo ubicación...</p>
    </div>

    <!-- Modal de Éxito -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-100 transition-transform border border-slate-100">
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
                <i class="fas fa-check text-4xl text-emerald-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">¡Registro Exitoso!</h2>
            <p class="text-slate-500 mb-8 font-medium">Los datos se han sincronizado correctamente en la base.</p>
            <button onclick="closeSuccessModal()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3.5 px-4 rounded-xl transition-colors shadow-md">
                Registrar Nuevo Cliente
            </button>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN PWA (APP PARA CELULARES)
        // =========================================================================
        
        const ICONO_APP_URL = "https://i.postimg.cc/FR0t3nMf/CLIENTES-(3).png";
        document.getElementById('apple-icon').href = ICONO_APP_URL;

        const appManifest = {
            "name": "Registro IMADE",
            "short_name": "IMADE",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#4f46e5",
            "icons": [
                { "src": ICONO_APP_URL, "sizes": "192x192", "type": "image/png" },
                { "src": ICONO_APP_URL, "sizes": "512x512", "type": "image/png" }
            ]
        };
        
        const blobManifest = new Blob([JSON.stringify(appManifest)], {type: 'application/manifest+json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(blobManifest);

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(event) {});`;
            const blobSW = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blobSW))
                .catch(err => console.log('SW Error:', err));
        }

        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalar');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); 
            deferredPrompt = e;
            btnInstalar.classList.remove('hidden'); 
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstalar.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // =========================================================================
        // LÓGICA DEL FORMULARIO
        // =========================================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8KYULiMngMxRqLXuJ38VsY2QQ__92DVDEdi5LDvEFW8IfMTDblXhWwqC48c87SQEM/exec"; 

        const form = document.getElementById('registroForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const successModal = document.getElementById('successModal');

        const municipiosGuatemala = {

            "El Progreso": ["Guastatoya", "Morazán", "San Agustín Acasaguastlán", "San Cristóbal Acasaguastlán", "El Jícaro", "Sansare", "Sanarate", "San Antonio La Paz"],

            "Guatemala": ["Guatemala", "Santa Catarina Pinula", "San José Pinula", "San José del Golfo", "Palencia", "Chinautla", "San Pedro Ayampuc", "Mixco", "San Pedro Sacatepéquez", "San Juan Sacatepéquez", "San Raymundo", "Chuarrancho", "Fraijanes", "Amatitlán", "Villa Nueva", "Villa Canales", "San Miguel Petapa"],

            "Petén": ["Flores", "San José", "San Benito", "San Andrés", "La Libertad", "San Francisco", "Santa Ana", "Dolores", "San Luis", "Sayaxché", "Melchor de Mencos", "Poptún", "Las Cruces", "El Chal"],

            "Suchitepéquez": ["Mazatenango", "Cuyotenango", "San Francisco Zapotitlán", "San Bernardino", "San José El Ídolo", "Santo Domingo Suchitepéquez", "San Lorenzo", "Samayac", "San Pablo Jocopilas", "San Antonio Suchitepéquez", "San Miguel Panán", "San Gabriel", "Chicacao", "Patulul", "Santa Bárbara", "San Juan Bautista", "Santo Tomás La Unión", "Zunilito", "Pueblo Nuevo", "Río Bravo", "San José La Máquina"],
            "Totonicapán": ["Totonicapán", "San Cristóbal Totonicapán", "San Francisco El Alto", "San Andrés Xecul", "Momostenango", "Santa María Chiquimula", "Santa Lucía La Reforma", "San Bartolo"],
            "Zacapa": ["Zacapa", "Estanzuela", "Río Hondo", "Gualán", "Teculután", "Usumatlán", "Cabañas", "San Diego", "La Unión", "Huité", "San Jorge"]
        };

        function actualizarMunicipios() {
            const deptoSelect = document.getElementById("departamento");
            const muniSelect = document.getElementById("municipio");
            const deptoElegido = deptoSelect.value;

            muniSelect.innerHTML = '<option value="" disabled selected>Selecciona un municipio</option>';
            
            if (deptoElegido && municipiosGuatemala[deptoElegido]) {
                muniSelect.disabled = false;
                muniSelect.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                muniSelect.classList.add('bg-slate-50', 'text-slate-700', 'cursor-pointer');

                const lista = municipiosGuatemala[deptoElegido].sort();
                lista.forEach(muni => {
                    const opcion = document.createElement("option");
                    opcion.value = muni;
                    opcion.textContent = muni;
                    muniSelect.appendChild(opcion);
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const vendedorGuardado = localStorage.getItem("vendedorGuardado");
            if (vendedorGuardado) {
                document.getElementById("vendedor").value = vendedorGuardado;
            }
        });

        function formatearTelefono(input) {
            let num = input.value.replace(/\D/g, '');
            if (num.length > 4) {
                num = num.substring(0, 4) + '-' + num.substring(4, 8);
            }
            input.value = num;
        }

        function capitalizarTexto(input) {
            let palabras = input.value.split(" ");
            let textoCapitalizado = palabras.map(palabra => {
                if(palabra.length > 0) {
                    return palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();
                }
                return "";
            }).join(" ");
            input.value = textoCapitalizado;
        }

        // =========================================================================
        // MEJORA: FUNCIÓN ROBUSTA PARA OBTENER UBICACIÓN EN MOVILES
        // =========================================================================
        function obtenerUbicacionGPS() {
            return new Promise((resolve, reject) => {
                if (!("geolocation" in navigator)) {
                    reject(new Error("Geolocalización no soportada por el navegador."));
                    return;
                }

                // INTENTO 1: Alta precisión (Tarda más, requiere buen cielo despejado)
                navigator.geolocation.getCurrentPosition(
                    (position) => resolve(position),
                    (errorInfo) => {
                        console.warn("Fallo alta precisión, intentando método de respaldo...", errorInfo.message);
                        loadingText.innerText = "Buscando ubicación aproximada...";
                        
                        // INTENTO 2: Baja precisión (Usa Antenas WiFi/Celular - No falla en interiores)
                        navigator.geolocation.getCurrentPosition(
                            (posBaja) => resolve(posBaja),
                            (errBaja) => reject(errBaja),
                            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
                        );
                    },
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            localStorage.setItem("vendedorGuardado", document.getElementById("vendedor").value);

            loadingText.innerText = "Obteniendo ubicación GPS...";
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');

            const now = new Date();
            const fechaFormateada = now.toLocaleString('es-GT');
            document.getElementById('fechaHora').value = fechaFormateada;

            try {
                // Llama a la nueva función robusta
                const position = await obtenerUbicacionGPS();
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                document.getElementById('ubicacion').value = `${lat}, ${lng}`;
                
                enviarDatosSheet();
            } catch (error) {
                console.warn("Error definitivo de GPS:", error.message);
                
                // Si incluso el método de respaldo falla, preguntamos al usuario si desea enviarlo sin ubicación
                const enviarSinGPS = confirm("⚠️ No pudimos obtener tu ubicación (Verifica los permisos de tu navegador). ¿Deseas guardar el registro sin GPS?");
                
                if (enviarSinGPS) {
                    document.getElementById('ubicacion').value = "Ubicación no disponible";
                    enviarDatosSheet();
                } else {
                    loadingOverlay.classList.add('hidden');
                    loadingOverlay.classList.remove('flex');
                }
            }
        });

        function enviarDatosSheet() {
            loadingText.innerText = "Sincronizando con base de datos...";
            
            const formData = new FormData(form);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
                successModal.classList.remove('hidden');
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert("❌ Hubo un error de conexión. Revisa que tengas internet (datos móviles o Wi-Fi) e inténtalo de nuevo.");
                loadingOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('flex');
            });
        }

        function closeSuccessModal() {
            successModal.classList.add('hidden');
            
            const vendedorActual = document.getElementById("vendedor").value;
            form.reset(); 
            document.getElementById("vendedor").value = vendedorActual;

            const muniSelect = document.getElementById("municipio");
            muniSelect.innerHTML = '<option value="" disabled selected>Primero elige un departamento</option>';
            muniSelect.disabled = true;
            muniSelect.classList.remove('bg-slate-50', 'text-slate-700', 'cursor-pointer');
            muniSelect.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
